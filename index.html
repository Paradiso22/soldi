<!--
THESIS: i soldi di Gio con la faccia amichevole delle app italiane quotidiane:
chiara, tonda, colorata, diretta. Convenzione scelta dall'utente (canone
Satispay/Hype-class, senza copiarne il brand): il loro livello di craft è la barra.
OWN-WORLD: carta calda (#f6f4f0), card bianche morbide, corallo (#ff4d3d) come
azione, giallo sole per gli accantonamenti, dischi colorati per categoria;
titoli Baloo 2, UI e numeri Nunito tabulare; pillole ovunque, ombre soffici.
STORY: apro, leggo quanto ho, scrivo "12 pizza contanti", la riga fa pop nella
lista; le fatture calcolano da sole quanto mettere da parte.
FIRST VIEWPORT: mobile - brand a badge corallo, saldo totale gigante tondo,
card conti, riquadro giallo "da parte", barra "scrivi qui" sopra la nav.
FORM: canone di categoria a piena fedeltà, scelto dall'utente dopo il mondo
lavagna (seed 1f2f84ab ritirato su preferenza esplicita).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
review, the verdict, and DESIGN.md.
-->
